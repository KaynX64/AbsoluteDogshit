version: '3.8'

services:
  # 1. MySQL 8.0 with Spatial Support
  mysql:
    image: mysql:8.0
    container_name: valetudo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: valetudo_healthlink
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. Redis Live Queue Cache
  redis:
    image: redis:7-alpine
    container_name: valetudo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # 3. MinIO S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: valetudo-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  mysql_data:
  minio_data: